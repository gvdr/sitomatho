name: Nightly Generation & Weekly Issue

on:
  schedule:
    # Nightly at 03:00 UTC: generate, gate, convolute, verify, and label new theorems
    - cron: "0 3 * * *"
    # Weekly on Sundays at 06:00 UTC: publish accumulated results as next issue
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      launch_issue:
        description: "Generate seven specialist results and replace Issue 1"
        required: false
        type: boolean
        default: false
      count:
        description: "Number of gated candidates to aim for"
        required: false
        default: "10"
      min_steps:
        description: "Minimum random walk length"
        required: false
        default: "4"
      max_steps:
        description: "Maximum random walk length"
        required: false
        default: "12"
      convolute:
        description: "Baroque proof convolution stages"
        required: false
        default: "6"
      publish_issue:
        description: "Publish an issue immediately"
        required: false
        type: boolean
        default: false
      areas:
        description: "Launch issue: Mathlib areas to explore"
        required: false
        default: "6"
      pool_factor:
        description: "Launch issue: candidates screened per published result"
        required: false
        default: "4"
      walk_timeout:
        description: "Launch issue: seconds one specialist walk may run"
        required: false
        default: "240"
      reeditorial_issue:
        description: "Optional issue number to re-run live GitHub Models editorial on (e.g. 1)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: journal-writes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-or-publish:
    runs-on: ubuntu-latest
    # A hosted runner stops a job at six hours. The launch issue may be given long walks.
    timeout-minutes: 300
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_ENDPOINT: ${{ vars.LLM_ENDPOINT }}
      DECISIONS_ENDPOINT: ${{ vars.DECISIONS_ENDPOINT }}
      DECIDER_1_MODEL: ${{ vars.DECIDER_1_MODEL }}
      DECIDER_2_MODEL: ${{ vars.DECIDER_2_MODEL }}
      NAMER_MODEL: ${{ vars.NAMER_MODEL }}
      GLOSS_MODEL: ${{ vars.GLOSS_MODEL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Re-run live LLM editorial on an existing issue (optional)
        if: ${{ !inputs.launch_issue && inputs.reeditorial_issue != '' }}
        run: |
          python3 scripts/reeditorial.py --issue "${{ inputs.reeditorial_issue }}" --reset-families

      - name: Install elan & Lean toolchain
        if: ${{ inputs.launch_issue || inputs.reeditorial_issue == '' }}
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Mathlib cache & build Generator A
        if: ${{ inputs.launch_issue || (inputs.reeditorial_issue == '' && github.event.schedule != '0 6 * * 0') }}
        run: |
          lake exe cache get
          lake build Babel Corpus walk

      - name: Generate and verify launch Issue 1
        if: ${{ inputs.launch_issue }}
        run: |
          python3 scripts/pipeline.py --launch-issue --wander \
            --areas "${{ inputs.areas || '6' }}" \
            --seed "$(( $(date -u +%s) + GITHUB_RUN_NUMBER ))" \
            --count 7 --max-attempts 260 \
            --pool-factor "${{ inputs.pool_factor || '4' }}" \
            --walk-timeout "${{ inputs.walk_timeout || '240' }}"

      - name: Run Mutating Specialist Generator, Baroque Convoluter, Verifier & Editorial Desk
        if: ${{ !inputs.launch_issue && inputs.reeditorial_issue == '' && github.event.schedule != '0 6 * * 0' }}
        run: |
          SEED=$(( $(date -u +%s) + ${{ github.run_number }} ))
          COUNT="${{ inputs.count || '6' }}"
          CONVOLUTE="${{ inputs.convolute || '4' }}"
          EXTRA=""
          if [ "${{ inputs.publish_issue }}" = "true" ]; then
            EXTRA="--publish-issue"
          fi
          python3 scripts/pipeline.py \
            --wander \
            --areas 4 \
            --seed "$SEED" \
            --count "$COUNT" \
            --pool-factor 4 \
            --max-attempts 260 \
            --exact-heartbeats 250000 \
            --aesop-heartbeats 250000 \
            --convolute "$CONVOLUTE" \
            $EXTRA

      - name: Publish Weekly Issue
        if: ${{ !inputs.launch_issue && inputs.reeditorial_issue == '' && github.event.schedule == '0 6 * * 0' }}
        run: python3 scripts/pipeline.py --issue-only

      - name: Commit & push verified results
        run: |
          git config user.name "AKCM Editorial Bot"
          git config user.email "akcm-bot@users.noreply.github.com"
          git add results/ state/
          if git diff --cached --quiet; then
            echo "No new verified results or issues to commit."
          elif [ "${{ inputs.launch_issue }}" = "true" ]; then
            git commit -m "Publish the AI SLOP launch issue"
            git push
          else
            git commit -m "akcm: nightly verified results / weekly issue ($(date -u +%Y-%m-%d))"
            git push
          fi

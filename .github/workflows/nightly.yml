name: Nightly Generation & Weekly Issue

on:
  schedule:
    # Nightly at 03:00 UTC: generate, gate, verify, and label new theorems
    - cron: "0 3 * * *"
    # Weekly on Sundays at 06:00 UTC: publish accumulated results as next issue
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      count:
        description: "Number of candidates to generate"
        required: false
        default: "6"
      publish_issue:
        description: "Publish an issue immediately"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  models: read

jobs:
  generate-or-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install elan & Lean toolchain
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Mathlib cache & build Generator A
        run: |
          lake exe cache get
          lake build Babel Corpus walk

      - name: Run Generator A, Kernel Verifier & Editorial Desk
        if: github.event.schedule != '0 6 * * 0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SEED=$(date -u +%Y%m%d)
          COUNT="${{ github.event.inputs.count || '6' }}"
          EXTRA=""
          if [ "${{ github.event.inputs.publish_issue }}" = "true" ]; then
            EXTRA="--publish-issue"
          fi
          python3 scripts/pipeline.py --seed "$SEED" --count "$COUNT" $EXTRA

      - name: Publish Weekly Issue
        if: github.event.schedule == '0 6 * * 0'
        run: python3 scripts/pipeline.py --issue-only

      - name: Commit & push verified results
        run: |
          git config user.name "AKCM Editorial Bot"
          git config user.email "akcm-bot@users.noreply.github.com"
          git add results/ state/
          if git diff --cached --quiet; then
            echo "No new verified results or issues to commit."
          else
            git commit -m "akcm: nightly verified results / weekly issue ($(date -u +%Y-%m-%d))"
            git push
          fi

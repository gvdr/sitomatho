# Configuration for AI dreams of Maths after too much cheese (AKCM)

[journal]
title = "AI dreams of Maths after too much cheese"
short_title = "AKCM"
subtitle = "Annals of Kernel-Checked Mathematics — a peer-reviewed repository of verified, unimportant theorems"
issn_joke = "AKCM-NO-ISSN"
id_prefix = "AKCM"
editor = "Giulio Valentino Dalla Riva"

[site]
# Hosted on a subdomain of gvdallariva.net via GitHub Pages CNAME.
# Setting custom_domain writes _site/CNAME, sets base_url = "https://<custom_domain>", and base_path = "".
base_url = "https://sitomatho.gvdallariva.net"
base_path = ""
custom_domain = "sitomatho.gvdallariva.net"
repo_url = "https://github.com/gvdr/sitomatho"

[llm]
# GitHub Models OpenAI-compatible endpoint (uses GITHUB_TOKEN with models: read in Actions)
endpoint = "https://models.github.ai/inference/chat/completions"
decider_1_model = "openai/gpt-4o-mini"
decider_2_model = "meta/llama-3.3-70b-instruct"
namer_model = "openai/gpt-4o-mini"
gloss_model = "openai/gpt-4o-mini"

[naming]
deprecate_after = 50
joint_eponym_min_score = 8

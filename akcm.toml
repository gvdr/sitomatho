# Configuration for AI Studies in Laboriously Obtained Proofs (AI SLOP)

[journal]
title = "AI Studies in Laboriously Obtained Proofs"
short_title = "AI SLOP"
subtitle = "A peer-reviewed repository of verified, unimportant theorems"
issn_joke = "AI-SLOP-NO-ISSN"
id_prefix = "AKCM"
editor = "Giulio Valentino Dalla Riva"

[site]
# Hosted on a subdomain of gvdallariva.net via GitHub Pages CNAME.
# Setting custom_domain writes _site/CNAME, sets base_url = "https://<custom_domain>", and base_path = "".
base_url = "https://sitomatho.gvdallariva.net"
base_path = ""
custom_domain = "sitomatho.gvdallariva.net"
repo_url = "https://github.com/gvdr/sitomatho"

[llm]
# Gemini API configuration:
# - Referee A uses `gemini-decision-1` via the zero-output-token Gemini Decisions API
# - Referee B, Namer, and Gloss use generative Gemini 4 via the OpenAI-compatible endpoint
# Set repository secret `LLM_API_KEY` (from https://aistudio.google.com/apikey) to enable live calls.
# Any OpenAI-compatible provider works by overriding LLM_ENDPOINT and *_MODEL variables.
endpoint = "https://generativelanguage.googleapis.com/v1beta/openai/"
decisions_endpoint = "https://generativelanguage.googleapis.com/v1beta/decisions"
decider_1_model = "gemini-decision-1"
decider_2_model = "gemini-4-hydrogen"
namer_model = "gemini-4-hydrogen"
gloss_model = "gemini-4-hydrogen"

[naming]
deprecate_after = 50
joint_eponym_min_score = 8
